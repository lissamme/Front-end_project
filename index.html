<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Front-end project</title>
</head>
<body>
    <div id="header"></div>
    <main class="main">
        <section class="hero">
            <div class="container">
                <div class="hero__content">
                    <div class="hero__text">
                        <h1 class="hero__title">
                            The people platform—Where interests become friendships
                        </h1>
                        <p class="hero__description">
                            Whatever your interest, from hiking and reading to networking and skill sharing,
                            there are thousands of people who share it on Meetup. Events are happening
                            every day—sign up to join the fun.
                        </p>
                        <button type="button" class="hero__button">Join Meetup</button>
                    </div>
                    <div class="hero__irl">
                        <img
                        class="hero__image"
                        src="./assets/svg/irl_event.svg"
                        alt="People riding a bike"
                        >
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script type="module" src="./js/index.js"></script>
</body>
</html>
