<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Events</title>
</head>
<body>

  <div id="header"></div>

  <main class="events-page">
    <div class="container">
      <section class="events-page__content">
        <div class="events-page__left">
          <h1 class="events-page__title">
            Events near New York, NY
          </h1>
          <a href="#" class="events-page__subtitle">
            Events
          </a>
        <div class="events-page__filters">
        <select id="dateFilter" class="events-page__filter">
            <option value="all">Any date</option>
        </select>

        <select id="typeFilter" class="events-page__filter">
            <option value="all">Any type</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
        </select>

        <select id="distanceFilter" class="events-page__filter">
            <option value="all">Any distance</option>
            <option value="5">5 km</option>
            <option value="10">10 km</option>
            <option value="25">25 km</option>
            <option value="50">50 km</option>
        </select>

        <select id="categoryFilter" class="events-page__filter">
            <option value="all">Any category</option>
            <option value="Business">Business</option>
            <option value="Technology">Technology</option>
            <option value="Hobbies and Passions">Hobbies and Passions</option>
            <option value="Social Activities">Social Activities</option>
            <option value="Health and Wellbeing">Health and Wellbeing</option>
        </select>
        </div>

          <div class="events-page__list" id="eventsPageList"></div>

        </div>
        <aside class="events-page__map">
            <p class="events-page__map-text">
                Find events near
            </p>
            <h2 class="events-page__map-title">
                New York, NY
            </h2>
            <div class="events-page__map-wrapper">
                <img
                    class="events-page__map-image"
                    src="./assets/img/map.jpg"
                    alt="Map"
                >
                <button class="events-page__map-close">
                    <img
                        src="./assets/svg/events-page/ex.svg"
                        alt="Close map"
                    >
                </button>
                <button class="events-page__map-button">
                    Browse in map
                </button>
            </div>
        </aside>
      </section>

    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="./js/events.js"></script>
</body>
</html>
