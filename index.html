<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Front-end project</title>
</head>
<body>
    <header class="header">
            <nav class="navbar">
                <a href="#" class="navbar__logo">
                    <img src="./assets/svg/logo.svg" alt="Meetup">
                </a>
                <div class="navbar__search">
                    <div class="navbar__search-events">
                        <img src="./assets/svg/search_logo-1.svg" alt="Search">
                        <input type="text" placeholder="Search events">
                    </div>
                    <div class="navbar__search-location">
                        <input type="text" value="Mountain View, CA">
                    </div>
                    <button class="navbar__search-btn">
                        <img src="./assets/svg/search_logo.svg" alt="Search">
                    </button>
                </div>
                <div class="navbar__actions">
                    <button class="navbar__lang-btn">
                        <img src="./assets/svg/internet.svg" alt="Language">
                        <span>English</span>
                    </button>
                    <a href="#">Log in</a>
                    <button type="submit" class="navbar__signup-btn">
                        Sign up
                    </button>
                </div>
            </nav>
    </header>
    <main class="main">
        <section class="hero">
            <div class="container">
                <div class="hero__content">
                    <div class="hero__text">
                        <h1 class="hero__title">
                            The people platform—Where interests become friendships
                        </h1>
                        <p class="hero__description">
                            Whatever your interest, from hiking and reading to networking and skill sharing,
                            there are thousands of people who share it on Meetup. Events are happening
                            every day—sign up to join the fun.
                        </p>
                        <button type="button" class="hero__button">Join Meetup</button>
                    </div>
                    <div class="hero__irl">
                        <img
                        class="hero__image"
                        src="./assets/svg/irl_event.svg"
                        alt="People riding a bike"
                        >
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
         <div class="container"></div>
    </footer>

    <script src="./js/index.js"></script>
</body>
</html>
